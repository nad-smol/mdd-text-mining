const tip = document.getElementById('tip');
function showTip(ev, text) {
  tip.style.display = 'block';
  tip.textContent = text;
  tip.style.left = (ev.originalEvent.clientX + 12) + 'px';
  tip.style.top = (ev.originalEvent.clientY + 12) + 'px';
}
